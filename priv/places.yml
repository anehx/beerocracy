# ┌──────────────────────────────────────────────────────────────────────────┐
# │  The Beerocracy Constitution — Article II: The Candidates                │
# └──────────────────────────────────────────────────────────────────────────┘
#
# This is the list of places we can vote for. Adding one is a pull request:
# copy an entry, fill it in, open the PR. No deploy dance, no migration.
#
# Every field below is required unless marked optional.
#
#   slug     A short, unique, lowercase id. Votes are stored against this, so
#            renaming a slug throws away that place's history. Renaming `name`
#            is free — do that instead.
#   name     What we call it out loud.
#   tagline  One line, max ~70 characters. It's the pitch on the swipe card.
#   emoji    A single emoji for the card. Optional, defaults to 🍺.
#   accent   Card colour. One of: amber, copper, gold, rust, moss, plum, slate.
#            Optional, defaults to amber.
#   beer     rating 0-5 and a note. Be honest, this is the whole point.
#   food     rating 0-5 and a note. Rate 1 with note "crisps, if you beg"
#            rather than leaving it out.
#   reach    How long it takes to get there from the office and from the
#            station. Each takes a `walk:` time, a `transit:` time (public
#            transport), or both — give both and the card leads with whichever
#            is quicker and notes the other. A bare number means walking, so
#            `office: 5` and `office: {walk: 5}` are the same thing.
#   open     Optional. When the place is open at all:
#              days: [thursday, friday]   which weekdays (default: all five)
#              from: "17:00"              opens (default: whenever)
#              to:   "20:00"              last orders (default: whenever)
#            Past midnight is fine: `to: "00:30"` means half past midnight.
#            Where hours differ by day, record the narrowest span that holds on
#            every weekday — better to understate than to send someone to a
#            locked door.
#            A place that cannot host the leading day is flagged, and one whose
#            hours miss the evening entirely leaves the ballot.
#   season   Optional, for pop-ups and summer bars:
#              from:  2026-06-12          not on the ballot before this
#              until: 2026-08-30          drops off the ballot after this
#   outdoor  Optional, true if the point of the place is being outside. Those
#            get a warning when the winning day looks wet.
#   tags     Optional list of short labels shown as chips on the card.
#   url      Optional link, shown on the results page.
#
# Ratings run 1 (regrettable) to 5 (we would queue for it). Use 0 for "there
# is none at all" — a pub with no kitchen is a different thing from a pub with
# a bad one, and the card prints it as "None" rather than an empty score.
#
# `reach` times are measured from the office and from Bern Hauptbahnhof. They
# are door-to-door estimates, not timetable truth — if one is wrong, fix it in
# a PR.

places:
  - slug: shamrock
    name: The Shamrock
    tagline: Indian "Irish" pub next to the office. A bit shady.
    emoji: 🇮🇳
    accent: amber
    beer:
      rating: 3
      note: Classic Swiss selection, but with Kilkenny and Guinness on tap.
    food:
      rating: 2
      note: Pub food. Edible, no more and no less.
    reach:
      office: 3
      station:
        walk: 11
        transit: 5
    open:
      from: "11:00"
      to: "23:00"
    tags:
      - irish
      - no tabs
      - weird
    url: https://theshamrock.ch/

  - slug: mccarthys
    name: McCarthy's
    tagline: The Irish pub in Bern, right next to the train station.
    emoji: ☘️
    accent: rust
    beer:
      rating: 4
      note: Standard selection plus a lot of Irish and English beers.
    food:
      rating: 5
      note: Pub grub, but very good.
    reach:
      office:
        walk: 18
        transit: 12
      station:
        walk: 5
    open:
      from: "11:30"
      to: "00:30"
    tags:
      - loud
      - full
      - at the station
    url: https://mccarthysirishpub.ch/bern/

  # No `open:` here on purpose — it is our own office, so Mon-Fri all year is
